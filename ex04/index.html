<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Sizing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Box Sizing</h1>

  <div class="container">
    <div class="box content">
      <h2>content-box</h2>
      <p>Width = 200px + padding + border</p>
    </div>

    <div class="box border">
      <h2>border-box</h2>
      <p>Width = 200px including padding + border</p>
    </div>
  </div>

</body>
</html>
